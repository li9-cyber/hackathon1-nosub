<!doctype html>
<html lang="zh-Hant"><head><script src="/static/services/base-path.js"></script><script src="/static/ui/theme.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" type="image/svg+xml" href="/static/brand/favicon.svg?v=cv-arrow-1"><meta name="theme-color" content="#f7f8f5"><title>最低要求管理 · Finance Career</title><link rel="stylesheet" href="/static/style.css"><link rel="stylesheet" href="/static/career.css"><script src="/static/career-admin.js" defer></script></head>
<body class="admin-page"><header class="site-header"><a href="/" class="brand"><span class="brand-mark"><img src="/static/brand/icon-light.svg?v=cv-arrow-1" alt="" width="36" height="36"></span><span>Finance Career <small>開發者後臺</small></span></a><a class="button-secondary" href="/">返回使用者頁</a></header><main>
<p class="eyebrow">平台資料 / 最低要求</p><h1>管理最低要求</h1><p class="lead">上傳團隊分析的最低要求，確認預覽後發布。發布的是資料版本，日常更新不需重新部署網站。</p>
<div id="admin-notice" class="notice" role="status" aria-live="polite" hidden></div><div id="admin-error" class="error" role="alert" hidden></div>
<section class="panel"><h2>目前已發布</h2><p id="published-status">正在讀取…</p><div class="toolbar left"><button id="admin-reload" type="button" class="button-secondary">重新讀取</button><button id="download-published" type="button" class="button-secondary" disabled>下載已發布 JSON</button></div><div id="published-list"></div><details><summary>最近的發布紀錄</summary><div id="admin-history"></div></details></section>
<section class="panel"><h2>1 · 上傳資料</h2><p>JSON 陣列，每項填 title（職類）、location（地區）及 jd（團隊分析的最低要求原文）；可另填 url 記錄來源。最多 40 個職類、600 KB。</p><p class="hint">未整理的原文會交由 DeepSeek 抽取條件；請在預覽中核對必要／加分條件、替代選項與來源引用。只有發布後才會出現在使用者的比對結果。</p><div class="toolbar left"><button id="download-template" type="button" class="button-secondary">下載上傳格式</button></div><label>上傳 JSON<input id="admin-file" type="file" accept=".json,application/json"></label><label>或貼上／修改 JSON<textarea id="admin-json" rows="12" spellcheck="false" placeholder='[{"title":"填入職類名稱","location":"Hong Kong","jd":"填入團隊分析的最低要求原文"}]'></textarea></label><button id="admin-preview" type="button">2 · 產生預覽</button></section>
<section id="preview-panel" class="panel" hidden><h2>2 · 核對預覽</h2><p id="preview-status"></p><p id="preview-changes" class="hint"></p><div id="admin-preview-list"></div><div class="toolbar left"><button id="admin-publish" type="button" disabled>3 · 發布此版本</button><button id="admin-cancel-preview" type="button" class="button-secondary">取消預覽</button></div></section>
</main></body></html>
